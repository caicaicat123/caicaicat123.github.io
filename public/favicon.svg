<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- 左竖三块：橙 → 橙红 → 红 -->
  <rect x="3" y="5.5" width="4.4" height="27" rx="2.2" fill="#F59F00"/>
  <rect x="7" y="7.5" width="4.4" height="25" rx="2.2" fill="#F76707"/>
  <rect x="11" y="9.5" width="4.4" height="23" rx="2.2" fill="#E03131"/>
  <!-- 中斜两块：紫 → 蓝（贯穿全高，托住两侧竖笔） -->
  <rect x="18.8" y="6.25" width="4.4" height="29.5" rx="2.2" fill="#9333EA" transform="rotate(-28 21 21)"/>
  <rect x="21.2" y="7.45" width="4.4" height="29.5" rx="2.2" fill="#2563EB" transform="rotate(-28 23.4 22.2)"/>
  <!-- 右竖三块：青 → 蓝绿 → 绿 -->
  <rect x="24.6" y="7" width="4.4" height="24" rx="2.2" fill="#22D3EE"/>
  <rect x="28.6" y="5.5" width="4.4" height="26" rx="2.2" fill="#0D9488"/>
  <rect x="32.6" y="4.5" width="4.4" height="28" rx="2.2" fill="#22C55E"/>
</svg>