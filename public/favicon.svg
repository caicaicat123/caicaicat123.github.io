<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 四色方块独立成标，不画底板：避免在浅色标签栏上出现一圈深色方块 -->
  <rect x="2" y="2" width="13" height="13" rx="2.5" fill="#5EEAD4"/>
  <rect x="17" y="2" width="13" height="13" rx="2.5" fill="#22D3EE"/>
  <rect x="2" y="17" width="13" height="13" rx="2.5" fill="#A78BFA"/>
  <rect x="17" y="17" width="13" height="13" rx="2.5" fill="#FACC15"/>
</svg>
